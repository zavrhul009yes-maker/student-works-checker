<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCheck - Вход</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 32px;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .tab-active {
            background: #667eea;
            color: white;
        }
        .tab-inactive {
            background: #e5e7eb;
            color: #374151;
        }
        .input-field {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            transition: all 0.3s;
        }
        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="card">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">📚 EduCheck</h1>
            <p class="text-gray-500 mt-1">Система проверки работ</p>
        </div>

        <div class="flex gap-2 mb-6">
            <button id="loginTab" class="tab-active flex-1 py-2 rounded-lg font-semibold transition-all">Вход</button>
            <button id="registerTab" class="tab-inactive flex-1 py-2 rounded-lg font-semibold transition-all">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" class="input-field mb-3">
            <input type="password" id="loginPassword" placeholder="Пароль" class="input-field mb-4">
            <button id="doLogin" class="btn-primary w-full text-white py-3 rounded-lg font-semibold">Войти</button>
        </div>

        <!-- Форма регистрации -->
        <div id="registerForm" class="hidden">
            <input type="text" id="regName" placeholder="Полное имя" class="input-field mb-3">
            <input type="email" id="regEmail" placeholder="Email" class="input-field mb-3">
            <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)" class="input-field mb-3">
            <select id="regRole" class="input-field mb-4 bg-white">
                <option value="student">👨‍🎓 Студент</option>
                <option value="teacher">👨‍🏫 Преподаватель</option>
            </select>
            <button id="doRegister" class="btn-primary w-full text-white py-3 rounded-lg font-semibold">Зарегистрироваться</button>
        </div>

        <div id="message" class="mt-4 text-center text-sm"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
